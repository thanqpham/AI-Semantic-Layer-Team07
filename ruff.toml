target-version = "py311"
line-length = 120

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort import order
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear (common bugs)
    "S",   # flake8-bandit (security analysis)
]
ignore = [
    "E501",  # line length (handled by formatter)
    "B008",  # allow FastAPI Depends() in function argument defaults
    "S101",  # allow assert statements in pytest
    "S104",  # allow 0.0.0.0 binding for Docker container configuration
    "S105",  # hardcoded password binding check false positives
    "S106",  # hardcoded password in function call false positives
    "UP038",  # keep isinstance(x, (A, B)) tuple form; avoid churn across services
]

[lint.per-file-ignores]
# Pre-existing, already-applied Alembic migration scripts must not be edited.
# These auto-generated files legitimately violate import-order (I001), use
# idempotency try/except/pass guards (S110), and interpolate table names into
# read-only validation queries (S608). Ignore only these rules for versions.
"alembic/versions/*.py" = ["I001", "S110", "S608"]

[format]
quote-style = "double"
indent-style = "space"
