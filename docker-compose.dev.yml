services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: semantic_layer_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U dev -d semantic_layer_dev" ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "8000:8000" # API
      - "5678:5678" # debugpy (Python remote debug)
    command: sh -c "alembic upgrade head && uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir src"
    env_file:
      - .env
    environment:
      - APP_ENV=development
      - LOG_LEVEL=DEBUG
      - DATABASE_URL=postgresql+asyncpg://dev:devpassword@postgres:5432/semantic_layer_dev
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-z6rT4P2X-8W9m1K3v5Y7b9N0c2V4x6Z8a0B2c4D6e8F=}
    volumes:
      - .:/app # bind mount toàn bộ source — hot-reload
      - /app/__pycache__ # tránh mount pycache từ host vào container
    depends_on:
      postgres:
        condition: service_healthy # đợi postgres sẵn sàng trước
    restart: "no" # dev thường tắt thủ công
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 15s

  pgweb:
    image: sosedoff/pgweb
    container_name: p-069-pgweb
    ports:
      - "8081:8081" # Quản lý Database Web UI (Không cần mật khẩu khi mở)
    environment:
      - DATABASE_URL=postgres://dev:devpassword@postgres:5432/semantic_layer_dev?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
    # persist data giữa các lần restart

