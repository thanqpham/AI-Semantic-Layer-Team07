# pg_hba.conf for the tls-demo target Postgres (profile tls-demo).
# gen_certs.sh copies this file into scripts/tls/certs/ where the container
# picks it up via -c hba_file=/certs/pg_hba.conf.
#
# Local socket + IPv4 loopback stay open (psql convenience inside the container).
# Every other TCP connection must use TLS AND present a client certificate
# issued by the demo CA -> this is what makes the demo mutual TLS (mTLS).
local   all   all                     trust
host    all   all     127.0.0.1/32    trust
hostssl all   all     all             scram-sha-256 clientcert=verify-ca
