version: 2
domain: retail_ecommerce
sources:
  - id: shopify_sales
    title: Shopify — Sales reports
    url: https://help.shopify.com/en/manual/reports-and-analytics/shopify-reports/report-types/default-reports/sales-report
    reviewed_at: '2026-10-23'
  - id: woocommerce_analytics
    title: WooCommerce — Analytics and Sales Reports
    url: https://woocommerce.com/document/woocommerce-analytics/
    reviewed_at: '2026-10-23'
  - id: shopify_profit
    title: Shopify — Profit reports
    url: https://help.shopify.com/en/manual/reports-and-analytics/shopify-reports/report-types/default-reports/profit-reports
    reviewed_at: '2026-10-23'
metrics:
  - id: net_sales
    name: Doanh số thuần
    aliases: [doanh thu, doanh số, net sales, revenue]
    meaning: Giá trị hàng bán sau các khoản giảm trừ đã xác nhận.
    variants:
      - name: merchandise_net_sales
        id: merchandise_net_sales
        criteria: {tax_basis: excludes_tax, refund_policy: subtract_returns_and_coupons, formula_basis: woocommerce_net_sales}
        formula: SUM(gross sales - returns - coupons)
        source_ids: [woocommerce_analytics]
      - name: shopify_net_sales
        id: shopify_net_sales
        criteria: {tax_basis: excludes_tax, refund_policy: subtract_sales_reversals, formula_basis: shopify_net_sales}
        formula: SUM(gross sales - discounts - sales reversals)
        source_ids: [shopify_sales]
      - name: merchandise_net_including_vat
        id: merchandise_net_including_vat
        criteria: {tax_basis: includes_vat, refund_policy: subtract_sales_reversals}
        formula: SUM(confirmed net merchandise amount before VAT + confirmed VAT amount after reversals)
        required_data: [net merchandise amount before VAT, VAT amount after reversals on the same grain]
        source_ids: []
        limitations: Derived variant; source terms distinguish sales and tax, but enterprise column meanings must be verified.
    grain: Một dòng cho mỗi đơn hàng hoặc dòng hàng; không trộn hai grain.
    required_data: [giá trị hàng bán, giảm giá, giá trị trả hàng]
    unit: Tiền tệ được doanh nghiệp xác nhận
    confirm: [thuế và phí vận chuyển, trạng thái đơn, kỳ ghi nhận trả hàng, tiền tệ]
    limitations: Không đồng nhất với tiền đã thu hoặc doanh thu kế toán; không trừ giảm giá hai lần.
  - id: completed_orders
    name: Số đơn hàng hoàn tất
    aliases: [đơn hàng, số đơn, order count, completed orders]
    meaning: Số đơn duy nhất thỏa điều kiện hoàn tất của doanh nghiệp.
    variants:
      - name: enterprise_completed_orders
        id: enterprise_completed_orders
        criteria: {order_status: confirmed_completed}
        formula: COUNT_DISTINCT(order key) with confirmed completion predicate
        source_ids: [shopify_sales]
    grain: Đơn hàng
    required_data: [khóa đơn hàng, trạng thái hoàn tất]
    unit: Đơn
    confirm: [ánh xạ trạng thái hoàn tất, thời điểm tính]
    limitations: Biến thể nội bộ; nguồn tham khảo đếm đơn được đặt, không xác định trạng thái hoàn tất của doanh nghiệp.
  - id: customers
    name: Số khách hàng
    aliases: [khách hàng, customers, customer count]
    meaning: Số khách hàng duy nhất trong phạm vi đã xác nhận.
    variants:
      - name: distinct_customers
        id: distinct_customers
        criteria: {population: confirmed_customer_population}
        formula: COUNT_DISTINCT(customer key)
        source_ids: [woocommerce_analytics]
    grain: Khách hàng
    required_data: [khóa khách hàng]
    unit: Khách hàng
    confirm: [khách đăng ký hay khách đã mua, thời kỳ và khách vãng lai]
    limitations: Không suy luận khách mới hoặc khách quay lại từ khóa khách hàng đơn thuần.
  - id: net_units
    name: Số lượng sản phẩm bán ròng
    aliases: [số lượng bán, sản phẩm bán, units sold, quantity]
    meaning: Lượng bán trừ lượng trả theo cùng đơn vị.
    variants:
      - name: net_quantity
        id: net_quantity
        criteria: {refund_policy: subtract_returned_quantity}
        formula: SUM(sold quantity - returned quantity)
        source_ids: [shopify_sales]
    grain: Dòng hàng
    required_data: [số lượng bán, số lượng trả]
    unit: Sản phẩm theo đơn vị đã xác nhận
    confirm: [đơn hủy, NULL ở số lượng trả, quy đổi đơn vị]
    limitations: Thiếu lượng trả thì chỉ đề xuất lượng bán gộp với tên và phạm vi rõ ràng.
  - id: delivery_hours
    name: Thời gian giao hàng trung bình
    aliases: [giao hàng, delivery, lead time]
    meaning: Thời gian giữa hai mốc nghiệp vụ được xác nhận.
    variants:
      - name: enterprise_delivery_duration
        id: enterprise_delivery_duration
        criteria: {start_event: confirmed_start_event, end_event: delivered_event}
        formula: AVG(TIMESTAMP_DIFF_HOURS(delivered timestamp, confirmed start timestamp))
        source_ids: []
    grain: Một lần giao hàng hoặc một đơn hàng được xác nhận
    required_data: [mốc bắt đầu, mốc giao thành công]
    unit: Giờ
    confirm: [mốc bắt đầu là đặt hàng hay bàn giao vận chuyển, múi giờ, giao nhiều lần]
    limitations: Công thức vận hành nội bộ, không gán cho chuẩn bên ngoài; thiếu mốc thì không tính.
  - id: aov
    name: Giá trị đơn hàng trung bình
    aliases: [aov, trung bình đơn hàng, giá trị trung bình trên mỗi đơn hàng, doanh thu trung bình, average order value]
    variants:
      - name: order_average_pre_tax
        id: order_average_pre_tax
        criteria: {tax_basis: excludes_tax, population: one_row_per_order}
        formula: AVG(confirmed order amount before tax)
        required_data: [một dòng cho mỗi đơn hàng, giá trị đơn trước thuế không NULL]
        source_ids: []
        limitations: Biến thể theo schema doanh nghiệp; chỉ tương đương tổng giá trị chia số đơn khi mỗi dòng là một đơn và cùng bộ lọc.
      - name: order_average_after_tax
        id: order_average_after_tax
        criteria: {tax_basis: includes_tax, population: one_row_per_order}
        formula: AVG(confirmed order amount after tax)
        required_data: [một dòng cho mỗi đơn hàng, giá trị đơn sau thuế không NULL]
        source_ids: []
        limitations: Biến thể theo schema doanh nghiệp; không tự suy ra đã trừ giảm giá.
      - name: order_average_after_tax_discount
        id: order_average_after_tax_discount
        criteria: {tax_basis: includes_tax, discount_policy: subtract_confirmed_discount, population: one_row_per_order}
        formula: AVG(confirmed after-tax order amount - confirmed discount amount)
        required_data: [một dòng cho mỗi đơn hàng, giá trị sau thuế, tổng giảm giá cùng grain và không NULL]
        source_ids: []
        limitations: Chỉ dùng khi metadata xác nhận giá sau thuế chưa trừ giảm giá, tránh trừ hai lần.
      - name: shopify_order_value
        id: shopify_order_value
        criteria: {formula_basis: shopify_sales, denominator: orders}
        formula: (gross sales excluding adjustments - discounts excluding adjustments) / orders
        source_ids: [shopify_sales]
      - name: woocommerce_order_value
        id: woocommerce_order_value
        criteria: {formula_basis: woocommerce_net_sales, denominator: orders}
        formula: net sales / orders
        source_ids: [woocommerce_analytics]
    meaning: Giá trị trung bình của cùng một tập đơn hàng.
    grain: Đơn hàng
    required_data: [giá trị theo biến thể đã chọn, khóa đơn hàng]
    unit: Tiền tệ trên đơn
    confirm: [biến thể công thức, trả hàng, trạng thái đơn, NULL ở giá trị]
    limitations: Dùng formula.ratio với tử số SUM giá trị theo biến thể và mẫu số COUNT_DISTINCT khóa đơn hàng trên cùng base_entity, cùng tập đơn đã xác nhận; không viết phép chia aggregates trong expression. AVG ở grain một dòng mỗi đơn chỉ dùng khi metadata chứng minh tương đương và NULL không đổi mẫu số. Mẫu số bằng 0 trả NULL.
  - id: gross_margin
    name: Biên lợi nhuận gộp
    aliases: [biên lợi nhuận, gross margin, margin]
    meaning: Tỷ phần lợi nhuận sau giá vốn trên doanh số thuần.
    variants:
      - name: merchandise_margin
        id: merchandise_margin
        criteria: {profit_basis: net_sales_minus_cogs, denominator: net_sales}
        formula: (net sales - COGS) / net sales
        source_ids: [shopify_profit]
    grain: Cùng tập giao dịch cho doanh số và giá vốn
    required_data: [doanh số thuần, giá vốn tại lúc bán]
    unit: Tỷ lệ hoặc phần trăm
    confirm: [nguồn giá vốn, phạm vi hàng trả, mẫu số bằng không]
    limitations: Thiếu giá vốn thì không khả thi; dùng formula.ratio với tử số SUM(doanh số thuần - giá vốn) và mẫu số SUM(doanh số thuần), các cột phải thuộc cùng base_entity và cùng grain. Không hỗ trợ tổng hợp từ nhiều bảng gốc. Dùng scale=100 nếu biểu diễn phần trăm; mẫu số bằng 0 trả NULL.
  - id: conversion
    name: Tỷ lệ chuyển đổi mua hàng
    aliases: [chuyển đổi, conversion, checkout]
    meaning: Tỷ phần phiên dẫn tới hành vi mua hàng được xác nhận.
    variants:
      - name: enterprise_purchase_sessions
        id: enterprise_purchase_sessions
        criteria: {numerator: converted_sessions, denominator: eligible_sessions}
        formula: distinct converted sessions / distinct eligible sessions
        source_ids: []
    grain: Phiên truy cập
    required_data: [khóa phiên, bằng chứng mua hàng theo phiên]
    unit: Tỷ lệ hoặc phần trăm
    confirm: [định nghĩa chuyển đổi, bot, attribution, kỳ quan sát]
    limitations: Biến thể nội bộ cần doanh nghiệp xác nhận; dùng formula.ratio với COUNT_DISTINCT khóa phiên ở cả hai phía trên cùng base_entity, filter mua hàng đã xác nhận chỉ đặt ở numerator.filters. Không dùng số đơn chia ID phiên; nếu bằng chứng mua hàng cần cột từ bảng khác thì chưa hỗ trợ. Dùng scale=100 nếu biểu diễn phần trăm; mẫu số bằng 0 trả NULL.
  - id: cancellation
    name: Tỷ lệ hủy đơn hàng
    aliases: [hủy đơn, đơn hàng bị hủy, tỷ lệ đơn hàng bị hủy, cancellation, cancel rate]
    meaning: Tỷ phần đơn bị hủy trong cùng tập đơn hợp lệ.
    variants:
      - name: enterprise_cancellation_rate
        id: enterprise_cancellation_rate
        criteria: {numerator: canceled_orders, denominator: eligible_orders}
        formula: distinct canceled orders / distinct eligible orders
        source_ids: []
    grain: Đơn hàng
    required_data: [khóa đơn hàng, trạng thái hủy]
    unit: Tỷ lệ hoặc phần trăm
    confirm: [phạm vi mẫu số, ánh xạ trạng thái hủy, kỳ ghi nhận]
    limitations: Biến thể nội bộ; dùng formula.ratio với COUNT_DISTINCT khóa đơn hàng ở cả hai phía trên cùng base_entity. Filter hủy chỉ đặt ở numerator.filters; metric.filters áp dụng cho cả hai phía để xác định tập đơn hợp lệ. Khi người dùng xác nhận tính tất cả đơn, denominator.filters=[] là đủ và không cần filter trạng thái cho mẫu số. Dùng scale=100 nếu biểu diễn phần trăm; mẫu số bằng 0 trả NULL.
  - id: units_per_transaction
    name: Số sản phẩm trên mỗi giao dịch
    aliases: [sản phẩm trên, units per transaction, upt]
    meaning: Lượng bán ròng trung bình trên mỗi đơn.
    variants:
      - name: net_units_per_order
        id: net_units_per_order
        criteria: {numerator: net_quantity, denominator: orders}
        formula: net quantity / total orders
        source_ids: [shopify_sales]
    grain: Đơn hàng và dòng hàng, phải tránh nhân bản đơn
    required_data: [lượng bán ròng, khóa đơn hàng]
    unit: Sản phẩm trên đơn
    confirm: [trả hàng, trạng thái đơn, quan hệ dòng hàng với đơn]
    limitations: Dùng formula.ratio với tử số SUM(số lượng bán - số lượng trả) và mẫu số COUNT_DISTINCT khóa đơn hàng khi các cột cùng base_entity và grain đã xác nhận. Không hỗ trợ công thức lấy cột từ nhiều bảng hoặc JOIN một-nhiều gây nhân bản; thiếu khóa đơn ở bảng chứa lượng bán thì chưa khả thi. Mẫu số bằng 0 trả NULL.
