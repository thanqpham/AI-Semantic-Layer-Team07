services:
  compiler-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: compiler_test
      POSTGRES_USER: compiler_test
      POSTGRES_PASSWORD: compiler_test
    ports:
      - "55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./tests/fixtures/compiler_postgres:/docker-entrypoint-initdb.d:ro

  compiler-mysql:
    image: mysql:8.0
    command: --sql-mode=STRICT_TRANS_TABLES,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION,ONLY_FULL_GROUP_BY
    environment:
      MYSQL_DATABASE: compiler_test
      MYSQL_USER: compiler_test
      MYSQL_PASSWORD: compiler_test
      MYSQL_ROOT_PASSWORD: compiler_root_test
    ports:
      - "53306:3306"
    tmpfs:
      - /var/lib/mysql
    volumes:
      - ./tests/fixtures/compiler_mysql:/docker-entrypoint-initdb.d:ro
