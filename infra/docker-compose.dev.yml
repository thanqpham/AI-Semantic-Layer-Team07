services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: semantic_layer_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U dev -d semantic_layer_dev" ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.dev
    ports:
      - "8000:8000" # API
      - "5678:5678" # debugpy (Python remote debug)
    command: sh -c "alembic upgrade head && uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir src"
    env_file:
      - ../.env
    environment:
      - APP_ENV=development
      - LOG_LEVEL=DEBUG
      - DATABASE_URL=postgresql+asyncpg://dev:devpassword@postgres:5432/semantic_layer_dev
    volumes:
      - ..:/app # bind mount toàn bộ source — hot-reload
      - /app/__pycache__ # tránh mount pycache từ host vào container
    depends_on:
      postgres:
        condition: service_healthy # đợi postgres sẵn sàng trước
    restart: "no" # dev thường tắt thủ công
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://127.0.0.1:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  pgadmin:
    image: dpage/pgadmin4
    container_name: p-069-pgadmin
    ports:
      - "8081:80" # Quản lý Database Web UI pgAdmin 4
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@admin.com
      - PGADMIN_DEFAULT_PASSWORD=admin
      - PGADMIN_CONFIG_SERVER_MODE=False
      - PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED=False
    volumes:
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
      - ./docker/pgadmin/pgpass:/pgadmin4/pgpass:ro
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # TLS demo target (không bật mặc định): chạy tay
  #   docker compose -f infra/docker-compose.dev.yml --profile tls-demo up -d target-postgres-tls
  # rồi bash scripts/tls/gen_certs.sh trước đó. Lưu ý Windows/Docker Desktop:
  # nếu postgres từ chối /certs/server.key vì perms bind mount, dùng
  # command: sh -c "cp /certs/* /tmp/c && chmod 600 /tmp/c/server.key && exec postgres -c ssl=on -c ssl_cert_file=/tmp/c/server.crt -c ssl_key_file=/tmp/c/server.key -c hba_file=/tmp/c/pg_hba.conf"
  target-postgres-tls:
    image: postgres:16-alpine
    profiles: ["tls-demo"]
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo123
      POSTGRES_DB: demo_shop
    ports:
      - "15432:5432"
    volumes:
      - ../scripts/tls/certs:/certs:ro
      - tls_certs_secure:/certs-sec
    # Windows bind-mounts cannot hold 0600 perms -> postgres refuses server.key
    # ("has group or world access"). Copy keys into a named volume first (chmod
    # works there), then start postgres via the image entrypoint (initdb-safe).
    command: >
      bash -c 'cp /certs/server.crt /certs/server.key /certs/client.crt /certs/client.key /certs/ca.crt /certs/pg_hba.conf /certs-sec/ &&
      chmod 600 /certs-sec/server.key /certs-sec/client.key &&
      chown postgres:postgres /certs-sec/server.key /certs-sec/client.key &&
      exec docker-entrypoint.sh postgres -c ssl=on
      -c ssl_cert_file=/certs-sec/server.crt
      -c ssl_key_file=/certs-sec/server.key
      -c ssl_ca_file=/certs-sec/ca.crt
      -c log_connections=on
      -c hba_file=/certs-sec/pg_hba.conf'
    networks:
      default: {}
      backend_net: {}

networks:
  backend_net:
    # Stack backend/frontend chạy ở project "ai-semantic-layer-team07" — khai báo
    # external để alias DNS "target-postgres-tls" resolve được từ backend container.
    name: ai-semantic-layer-team07_default
    external: true

volumes:
  postgres_data:
  tls_certs_secure:
    # persist data giữa các lần restart
  pgadmin_data:


