name: GitOps Sync

on:
  workflow_call:
    inputs:
      image_tag:
        required: true
        type: string
    secrets:
      GITOPS_TOKEN:
        required: true

jobs:
  sync:
    name: Update cloud-infra
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cloud-infra
        uses: actions/checkout@v4
        with:
          repository: QuanAnh280605/cloud-infra
          token: ${{ secrets.GITOPS_TOKEN }}
          ref: main

      - name: Update tags in values.yaml for API and UI
        run: |
          # Cập nhật image tag mới cho Backend API
          sed -i -E "s/(tag: ).*/\1\"${{ inputs.image_tag }}\"/" apps/semantic-layer-api/values.yaml

          # Cập nhật image tag mới cho Frontend UI
          sed -i -E "s/(tag: ).*/\1\"${{ inputs.image_tag }}\"/" apps/semantic-layer-ui/values.yaml

          # Kiểm tra sự thay đổi
          git diff apps/semantic-layer-api/values.yaml apps/semantic-layer-ui/values.yaml

      - name: Commit and Push to cloud-infra
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/semantic-layer-api/values.yaml apps/semantic-layer-ui/values.yaml
          git commit -m "chore(gitops): update semantic-layer images to ${{ inputs.image_tag }} [skip ci]"
          git push origin main