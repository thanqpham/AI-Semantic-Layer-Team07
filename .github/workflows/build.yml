name: Build & Push Image

on:
  workflow_call:
    outputs:
      image_tag:
        description: "Commit short SHA tag"
        value: ${{ jobs.build.outputs.image_tag }}

jobs:
  build:
    name: Build ARM64 & Trivy Scan
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.sha_short }}
    steps:
      - uses: actions/checkout@v4

      - name: Get short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # Build image local để quét Trivy trước
      - name: Build local image for Trivy scan
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: local-scan:${{ steps.vars.outputs.sha_short }}

      - name: Scan Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: local-scan:${{ steps.vars.outputs.sha_short }}
          format: "table"
          exit-code: "0"
          severity: "CRITICAL,HIGH"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Push image ARM64 chính thức lên GHCR
      - name: Build & Push ARM64 Image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ai-semantic-layer-backend:${{ steps.vars.outputs.sha_short }}
            ghcr.io/${{ github.repository_owner }}/ai-semantic-layer-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max