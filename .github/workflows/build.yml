name: Build & Push Images

on:
  workflow_call:
    outputs:
      image_tag:
        description: "Commit short SHA tag"
        value: ${{ jobs.detect-changes.outputs.sha_short }}
      backend_changed:
        description: "Backend has changes"
        value: ${{ jobs.detect-changes.outputs.backend }}
      frontend_changed:
        description: "Frontend has changes"
        value: ${{ jobs.detect-changes.outputs.frontend }}

jobs:
  # ==============================================================
  # 0. KIỂM TRA XEM PHẦN NÀO ĐƯỢC CHỈNH SỬA
  # ==============================================================
  detect-changes:
    name: Detect Changed Files
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      sha_short: ${{ steps.vars.outputs.sha_short }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Get short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Check paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'src/**'
              - 'infra/**'
              - 'requirements*.txt'
              - 'alembic/**'
              - 'Dockerfile'
            frontend:
              - 'frontend/**'

  # ==============================================================
  # 1. BUILD & SCAN BACKEND (Chỉ chạy khi có sửa code Backend)
  # ==============================================================
  build-backend:
    name: Build & Scan Backend (ARM64)
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build local Backend image for scanning
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./infra/Dockerfile
          load: true
          tags: backend-scan:${{ needs.detect-changes.outputs.sha_short }}

      - name: Scan Backend Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: backend-scan:${{ needs.detect-changes.outputs.sha_short }}
          format: "table"
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Backend ARM64
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./infra/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ai-semantic-layer-backend:${{ needs.detect-changes.outputs.sha_short }}
            ghcr.io/${{ github.repository_owner }}/ai-semantic-layer-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==============================================================
  # 2. BUILD & SCAN FRONTEND (Chỉ chạy khi có sửa code Frontend)
  # ==============================================================
  build-frontend:
    name: Build & Scan Frontend (ARM64)
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build local Frontend image for scanning
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=https://api.140.245.58.162.nip.io
          load: true
          tags: frontend-scan:${{ needs.detect-changes.outputs.sha_short }}

      - name: Scan Frontend Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: frontend-scan:${{ needs.detect-changes.outputs.sha_short }}
          format: "table"
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Frontend ARM64
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/arm64
          push: true
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=https://api.140.245.58.162.nip.io
          tags: |
            ghcr.io/${{ github.repository_owner }}/ai-semantic-layer-frontend:${{ needs.detect-changes.outputs.sha_short }}
            ghcr.io/${{ github.repository_owner }}/ai-semantic-layer-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max