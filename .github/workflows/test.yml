name: Lint & Unit Tests

on:
  workflow_call:

jobs:
  test:
    name: Run Lint and Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Lint with Ruff
        run: python -m ruff check src/ tests/
      - name: Run Pytest
        run: python -m pytest tests/ -v --tb=short --ignore=tests/test_integration/test_compiler_cross_database_live.py
        env:
          APP_ENV: test
          OPENAI_API_KEY: test-key
          PYTHONPATH: .

  compiler-live-integration:
    name: Cross-database compiler integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: compiler_test
          POSTGRES_USER: compiler_test
          POSTGRES_PASSWORD: compiler_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U compiler_test -d compiler_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: compiler_test
          MYSQL_USER: compiler_test
          MYSQL_PASSWORD: compiler_test
          MYSQL_ROOT_PASSWORD: compiler_root_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pcompiler_root_test"
          --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Configure isolated readers and report versions
        run: |
          python --version
          docker exec ${{ job.services.postgres.id }} psql -U compiler_test -d compiler_test -c 'SELECT version()'
          docker exec -i ${{ job.services.postgres.id }} psql -v ON_ERROR_STOP=1 -U compiler_test -d compiler_test < tests/fixtures/compiler_postgres/01-reader.sql
          docker exec ${{ job.services.mysql.id }} mysql -uroot -pcompiler_root_test -e "SET GLOBAL sql_mode='STRICT_TRANS_TABLES,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION,ONLY_FULL_GROUP_BY'; SELECT VERSION(), @@GLOBAL.sql_mode;"
          docker exec -i ${{ job.services.mysql.id }} mysql -uroot -pcompiler_root_test < tests/fixtures/compiler_mysql/01-reader.sql
          python -c "import sqlite3; print('SQLite', sqlite3.sqlite_version)"
      - name: Run live compiler tests
        run: python -m pytest tests/test_integration/test_compiler_cross_database_live.py -q
        env:
          APP_ENV: test
          PYTHONPATH: .
          COMPILER_TEST_POSTGRES_URL: postgresql+asyncpg://compiler_reader:compiler_reader_test@127.0.0.1:5432/compiler_test
          COMPILER_TEST_POSTGRES_SETUP_URL: postgresql+asyncpg://compiler_test:compiler_test@127.0.0.1:5432/compiler_test
          COMPILER_TEST_MYSQL_URL: mysql+asyncmy://compiler_reader:compiler_reader_test@127.0.0.1:3306/compiler_test
          COMPILER_TEST_MYSQL_SETUP_URL: mysql+asyncmy://compiler_test:compiler_test@127.0.0.1:3306/compiler_test
          COMPILER_TEST_SQLITE_URL: sqlite+aiosqlite:///compiler-test.db
