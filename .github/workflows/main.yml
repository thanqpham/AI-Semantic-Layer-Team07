name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  # 1. Chạy quét bảo mật
#   security:
#     name: Security
#     uses: ./.github/workflows/security.yml
#     secrets: inherit

#   # 2. Chạy kiểm thử chất lượng code
#   test:
#     name: Quality & Test
#     uses: ./.github/workflows/test.yml

  # 3. Build & Scan Image (chỉ chạy khi cả Security & Test pass, và chỉ trên nhánh main)
  build:
    name: Build & Push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    uses: ./.github/workflows/build.yml
    secrets: inherit

  # 4. Đẩy tag sang GitOps repo (chỉ chạy khi Build thành công)
  deploy:
    name: GitOps Handoff
    needs: [build]
    uses: ./.github/workflows/gitops.yml
    with:
      image_tag: ${{ needs.build.outputs.image_tag }}
    secrets: inherit