metric: return_rate
business_name: "Tỷ lệ hoàn trả"
domain: ecommerce
metric_type: derived
target_entity: order
source_table: fact_orders
aggregation: ratio
field: null
business_formula: "Returned Orders / Total Orders"
sql_expression: "COUNT(DISTINCT CASE WHEN order_status = 'returned' THEN order_id END) / COUNT(DISTINCT order_id)"
dependencies: []
description: "Tỷ lệ phần trăm đơn hàng bị hoàn trả hoặc hoàn tiền trên tổng số đơn hàng đã bán."
default_filters:
  - condition: "is_test_order = FALSE"
allowed_dimensions: [order.order_date, order.channel, order.store_id]
default_time_grain: month
reference_source: "Shopify Analytics Fields"
status: draft
owner: Seller
ground_truth_source: "Ecommerce_Metric_Dictionary_Ground_Truth.xlsx#return_rate"
synonyms: ["tỷ lệ hoàn trả", "return rate", "refund rate"]
