metric: order_cancellation_rate
business_name: "Tỷ lệ hủy đơn hàng"
domain: ecommerce
metric_type: derived
target_entity: order
source_table: fact_orders
aggregation: ratio
field: null
business_formula: "Cancelled Orders / Total Orders"
sql_expression: "COUNT(DISTINCT CASE WHEN is_canceled = TRUE THEN order_id END) * 1.0 / NULLIF(COUNT(DISTINCT order_id), 0)"
dependencies: []
description: "Tỷ lệ đơn hàng bị hủy trên tổng số đơn hàng phát sinh (không tính đơn test), mẫu số gồm cả đơn bị hủy."
default_filters:
  - condition: "is_test_order = FALSE"
allowed_dimensions: [order.order_date, order.channel, order.store_id, city.city_name, city.region_name]
default_time_grain: month
reference_source: "Ecommerce Metric Dictionary (Expanded)"
status: draft
owner: Seller
ground_truth_source: "Ecommerce_Metric_Dictionary_Ground_Truth_Expanded.xlsx#order_cancellation_rate"
synonyms: ["tỷ lệ hủy đơn", "cancellation rate", "order cancel rate"]
