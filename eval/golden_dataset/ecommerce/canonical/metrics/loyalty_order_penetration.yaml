metric: loyalty_order_penetration
business_name: "Tỷ lệ đơn qua thẻ thành viên"
domain: ecommerce
metric_type: derived
target_entity: order
source_table: fact_orders
aggregation: ratio
field: null
business_formula: "Orders with Loyalty Card / Total Orders"
sql_expression: "COUNT(DISTINCT CASE WHEN loyalty_card_id IS NOT NULL THEN order_id END) * 1.0 / NULLIF(COUNT(DISTINCT order_id), 0)"
dependencies: []
description: "Tỷ lệ đơn hàng đặt bằng thẻ thành viên trên tổng số đơn hàng phát sinh (không tính đơn test), mẫu số gồm cả đơn bị hủy."
default_filters:
  - condition: "is_test_order = FALSE"
allowed_dimensions: [order.order_date, order.channel, order.store_id, city.city_name, city.region_name]
default_time_grain: month
reference_source: "Ecommerce Metric Dictionary (Expanded)"
status: draft
owner: Seller
ground_truth_source: "Ecommerce_Metric_Dictionary_Ground_Truth_Expanded.xlsx#loyalty_order_penetration"
synonyms: ["tỷ lệ đơn thẻ thân thiết", "loyalty order penetration", "penetration thẻ thành viên"]
