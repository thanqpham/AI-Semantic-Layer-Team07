allowed_dimensions: [order_item.order_date, order_item.product_id, order_item.channel, order_item.store_id, city.city_name, city.region_name]
default_time_grain: day
reference_source: "Shopify Analytics Fields"
status: draft
owner: Seller
ground_truth_source: "Ecommerce_Metric_Dictionary_Ground_Truth_Expanded.xlsx#units_sold"
synonyms: ["số lượng bán", "units sold", "sản phẩm bán ra"]
