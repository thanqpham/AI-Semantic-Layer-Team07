metric: units_sold
business_name: "Số lượng sản phẩm bán ra"
domain: ecommerce
metric_type: simple
target_entity: order_item
source_table: fact_order_items
aggregation: sum
field: quantity
business_formula: "SUM(Quantity)"
sql_expression: "SUM(quantity)"
dependencies: []
description: "Tổng số đơn vị sản phẩm đã đặt trong kỳ trên các dòng đơn không test (số lượng gross, chưa trừ hoàn trả và chưa loại dòng thuộc đơn bị hủy)."
default_filters:
