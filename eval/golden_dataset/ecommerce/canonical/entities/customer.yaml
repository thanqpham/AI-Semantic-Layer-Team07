entity: customer
table_mapping: customers
business_name: "Khách hàng"
description: "Thông tin tham chiếu của khách hàng phát sinh đơn hàng."
synonyms: ["người mua", "bên mua", "customer"]
accepted_business_names: ["Khách hàng", "Người mua"]
dimensions:
  - name: id
    business_name: "Mã khách hàng"
    type: number
    field: id
    primary_key: true
  - name: name
    business_name: "Tên khách hàng"
    type: string
    field: name
    synonyms: ["họ tên", "tên người mua"]
  - name: email
    business_name: "Địa chỉ email"
    type: string
    field: email
  - name: city
    business_name: "Tỉnh thành phố"
    type: string
    field: city
    synonyms: ["thành phố", "tỉnh thành", "địa bàn"]
  - name: created_at
    business_name: "Ngày đăng ký"
    type: time
    field: created_at
  - name: default_address_id
    business_name: "Mã địa chỉ mặc định"
    type: number
    field: default_address_id
relationships:
  - target_entity: order
    relation_type: HAS_MANY
    join_condition: "customers.id = fact_orders.customer_id"
    inferred: false
  - target_entity: address
    relation_type: BELONGS_TO
    join_condition: "customers.default_address_id = customer_addresses.address_id"
    inferred: false
